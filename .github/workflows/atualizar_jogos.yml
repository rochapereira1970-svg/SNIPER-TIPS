name: Autorun Rei da Rodada com Auditoria

on:
  schedule:
    - cron: '1 3 * * *'   # Roda às 00:01 de Brasília (Gera a grade do dia)
    - cron: '30 2 * * *'  # Roda às 23:30 de Brasília (Audita os resultados e calcula Greens)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Baixar o código
      uses: actions/checkout@v3
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Instalar ferramentas
      run: pip install requests pandas
    - name: Rodar Robô e Auditor
      run: python cron_atualizador.py
    - name: Salvar alterações
      run: |
        git config --global user.name "Robo Rei da Rodada"
        git config --global user.email "robo@reidarodada.com"
        git add app.py auditoria_resultados.csv || echo "Sem arquivos novos"
        git commit -m "🤖 Grade e painel de auditoria atualizados" || echo "Sem mudanças"
        git push
