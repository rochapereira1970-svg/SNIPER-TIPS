name: Autorun Rei da Rodada com Cores

on:
  schedule:
    - cron: '1 3 * * *'
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Baixar o codigo
      uses: actions/checkout@v3
      
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Instalar ferramentas
      run: pip install requests pandas
      
    - name: Rodar Robo e Cores
      run: python cron_atualizador.py
      
    - name: Salvar alterações
      run: |
        git config --global user.name "Robo Rei da Rodada"
        git config --global user.email "robo@reidarodada.com"
        git add app.py jogos_status.json || echo "Sem arquivos"
        git commit -m "🤖 Atualizacao de cores e resultados" || echo "Sem mudancas"
        git push
